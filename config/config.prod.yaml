# scylla2ch — PRODUCTION config
# Read-only CDC replication: ScyllaDB → ClickHouse
#
# ACCESS MODEL:
#   ScyllaDB — READ ONLY:
#     - Reads CDC log tables (*_scylla_cdc_log) for change events
#     - Reads system_schema.tables/columns for auto-discovery
#     - One exception: scylla-cdc-go library writes scylla2ch_progress table
#       (checkpoint tracking — one row per stream, tiny, unavoidable)
#     - NEVER reads/writes your production data tables
#
#   ClickHouse — INSERT ONLY:
#     - INSERTs batched CDC rows into existing tables
#     - Reads system.tables to check if table exists
#     - You create ClickHouse tables manually (auto_create: false)
#     - NEVER does CREATE/ALTER/DROP on your ClickHouse tables
#
# HOW IT WORKS:
#   1. Enable CDC on ScyllaDB: ALTER TABLE ks.t WITH cdc = {'enabled': true};
#   2. Create ClickHouse table manually (DDL from schema.go or your own)
#   3. Add table to config/tables.d/<name>.yaml
#   4. Reload: docker kill --signal=HUP scylla2ch
#   Nothing is automatic — you control exactly what streams and where.
#
# ALL VALUES via environment variables — no secrets in this file.

scylla:
  hosts:
    - "${SCYLLA_HOST_0}:${SCYLLA_PORT:-9142}"
    - "${SCYLLA_HOST_1}:${SCYLLA_PORT:-9142}"
    - "${SCYLLA_HOST_2}:${SCYLLA_PORT:-9142}"
  port: ${SCYLLA_PORT:-9142}
  keyspace: "${SCYLLA_KEYSPACE}"
  username: "${SCYLLA_USER}"
  password: "${SCYLLA_PASSWORD}"
  tls: true
  ca_cert_base64: "${SCYLLA_CA_CERT_BASE64}"  # base64 PEM — K8s secret / env var
  # ca_cert_path: "/etc/scylla2ch/certs/scylla-cloud-ca.pem"  # alternative: file mount
  dc: "${SCYLLA_DC}"
  consistency: "local_quorum"

clickhouse:
  host: "${CH_HOST}"
  port: ${CH_PORT:-9440}           # 9440 = native TCP for ClickHouse Cloud
  database: "${CH_DATABASE}"
  username: "${CH_USER}"
  password: "${CH_PASSWORD}"
  tls: true
  compression: "lz4"
  dial_timeout: "2m"
  max_open_conns: 10               # ≥ number of tables for parallel flushes
  max_idle_conns: 5

cdc:
  mode: "delta"
  confidence_window: "5s"          # ScyllaDB consensus window
  query_window: "1m"               # CDC log scan window
  change_age_limit: "8h"           # how far back on first start
  checkpoint_interval: "60s"       # progress checkpoint frequency

batch:
  size: 10000                      # flush at 10K rows
  interval: "5s"                   # or every 5s (whichever first)
  retry_max: 3                     # 4 total attempts
  retry_backoff: "500ms"           # exponential: 500ms, 1s, 2s, 4s

tables:
  auto_discover: false             # manual only — you control which tables stream
  auto_create: false               # manual only — you create ClickHouse tables yourself

  # Add tables here. SIGHUP reloads this list without restart.
  # docker kill --signal=HUP scylla2ch
  explicit:
    - name: "messages"
    - name: "rooms"
    - name: "ai_reply_suggestions"
    - name: "moderation_events"
    - name: "first_exchange_lifecycle"
    - name: "llm_mod_windows"
    - name: "llm_mod_strikes"
    - name: "posts_by_id"
    - name: "comments_by_post"
    - name: "votes_by_post"

metrics:
  port: 9090
  path: "/metrics"

health:
  port: 8080

dashboard:
  user: "${SCYLLA2CH_DASHBOARD_USER}"
  pass: "${SCYLLA2CH_DASHBOARD_PASS}"
